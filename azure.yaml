# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: retail-pulse
metadata:
  template: azd-init@1.11.0
services:
  api:
    project: ./src/RetailPulse.Api
    host: containerapp
    language: dotnet
  mcpserver:
    project: ./src/RetailPulse.McpServer
    host: containerapp
    language: dotnet
  teamsbot:
    project: ./src/RetailPulse.TeamsBot
    host: containerapp
    language: dotnet
  frontend:
    project: ./src/RetailPulse.Web
    host: staticwebapp
    language: js
    dist: dist
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: ./azd-hooks/preprovision.ps1
    posix:
      shell: sh
      run: ./azd-hooks/preprovision.sh
    continueOnError: false
  postprovision:
    windows:
      shell: pwsh
      run: ./azd-hooks/postprovision.ps1
    posix:
      shell: sh
      run: ./azd-hooks/postprovision.sh
    continueOnError: false
  predeploy:
    windows:
      shell: pwsh
      # Serializes the shared RetailPulse.ServiceDefaults project build before
      # azd's parallel api/mcpserver/teamsbot publish — fixes the sourcelink.json
      # writer race that caused intermittent publish failures during the
      # issue #67 P0 incident. See azd-hooks/predeploy.ps1 for the full writeup.
      run: ./azd-hooks/predeploy.ps1
    posix:
      shell: sh
      run: ./azd-hooks/predeploy.sh
    continueOnError: false
