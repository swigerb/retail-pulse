      - GetDepletionStats
      - GetVariantMix
      - GetFieldSentiment
      - CreateChart

  memory-management:
    name: "Memory Management Agent"
    model: "gpt-5.4-mini"
    key: "memory-management"
    use_knowledge_base: false
    display_name: "Memory Management"
    role: "bespoke"
    intents:
      - "memory/management"
    fallback_reply: "I couldn't complete that memory operation."
    system_prompt: |
      You are the memory-management specialist. Route explicit memory commands
      (store, retrieve, clear) to the underlying memory store; never fabricate
      remembered content.
    temperature: 0.2
    tools: []
