      A guild's satisfaction with kit accessibility is a leading indicator
      for the next quarter's workshop-programming enrollment.

      Brands: {tenant.brands}
      Regions: {tenant.regions}
    temperature: 0.5
    tools:
      - GetFieldSentiment
      - CreateChart

  maker-margin:
    name: "Maker Margin Agent"
    model: "gpt-5.4-mini"
    key: "margin-analysis"
    use_knowledge_base: true
    knowledge_base_name: ""
    display_name: "Maker Margin"
    role: "specialist"
    intents:
      - "margin/analysis"
    keyword_fast_paths:
      - "kit margin"
      - "workshop margin"
    fallback_reply: "I couldn't produce a maker margin analysis."
    system_prompt: |
      You are the Maker Margin specialist for {tenant.company}. You focus on
      kit-bundle margin architecture and workshop-seat contribution — the two
      largest levers behind category profitability.

      Always ground analysis in tool data; never fabricate margin figures.

      Brands: {tenant.brands}
      Regions: {tenant.regions}
    temperature: 0.3
    tools:
      - GetMarginByBrand
      - GetMarginDrivers
      - GetMarginTrend
      - DetectMarginRisks
      - CreateChart

  retail-pulse:
    name: "Prairiehearth Pulse Agent"
    model: "gpt-5.4-mini"
    key: "general"
    use_knowledge_base: true
