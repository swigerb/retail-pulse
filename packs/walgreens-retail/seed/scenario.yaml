# Walgreens (unofficial synthetic demo) scenario seed manifest.
#
# Unofficial demonstration; no affiliation with Walgreens. Every name, metric,
# recall, and disruption below is invented and non-clinical. No patient or
# customer data, logos, non-public facts, or real store results. Values are
# static so seeded output is deterministic.

version: 1

seasonality:
  factors:
    Cold & Flu:
      - month: 1
        multiplier: 1.35
        event: Winter Illness Peak
        description: Synthetic peak in cold and flu unit sales
      - month: 7
        multiplier: 0.80
        event: Summer Trough
        description: Synthetic low season for cold and flu units
      - month: 11
        multiplier: 1.20
        event: Early Season Build
        description: Synthetic stock build ahead of winter
    Allergy & Sinus:
      - month: 4
        multiplier: 1.30
        event: Spring Pollen Season
        description: Synthetic spring lift in allergy units
      - month: 9
        multiplier: 1.12
        event: Fall Pollen Season
        description: Synthetic fall lift in allergy units
    Pain & Fever:
      - month: 1
        multiplier: 1.15
        event: Winter Illness Peak
        description: Synthetic companion lift to cold and flu
      - month: 6
        multiplier: 0.95
        event: Summer Softening
        description: Synthetic modest seasonal dip
    Digestive Health:
      - month: 12
        multiplier: 1.18
        event: Holiday Season
        description: Synthetic holiday lift in digestive units
    First Aid:
      - month: 6
        multiplier: 1.22
        event: Summer Activity
        description: Synthetic outdoor-activity lift in first aid units

competitive:
  competitorsByCategory:
    Cold & Flu:
      - Fictional Corner Pharmacy
      - Sample Neighborhood Drug
    Pain & Fever:
      - Fictional Corner Pharmacy
      - Example Wellness Mart
    Allergy & Sinus:
      - Sample Neighborhood Drug
      - Example Wellness Mart
    Digestive Health:
      - Example Wellness Mart
      - Imaginary Health Depot
    First Aid:
      - Fictional Corner Pharmacy
      - Imaginary Health Depot
  pricingSources: [synthetic_price_check, synthetic_flyer_scan]
  shareSources: [synthetic_panel, internal_estimate]
  activityTypes: [price_match, bundle_offer, stock_gap]
  impactLevels: [flagship, watchlist, monitor]
  activityTemplates:
    - type: price_match
      description: "{0} advertised a lower shelf price on {2} in {3}"
      recommendation: MATCH — Review price on the affected SKU for stores in the region
    - type: bundle_offer
      description: "{0} launched a seasonal bundle including {2} in {3}"
      recommendation: DIFFERENTIATE — Highlight pickup convenience and availability
    - type: stock_gap
      description: "{0} showed limited availability of {2} in {3}"
      recommendation: PREEMPT — Confirm on-shelf availability and days of supply

promos:
  types:
    - name: Seasonal Relief Bundle
      liftBase: 12.0
      liftRange: 18.0
      coefBase: 16.0
      coefRange: 5.0
      code: seasonal-relief-bundle
      displayName: Seasonal Relief Bundle
      description: Synthetic multi-item bundle for in-season relief categories
    - name: Pickup Convenience Offer
      liftBase: 8.0
      liftRange: 12.0
      coefBase: 11.0
      coefRange: 4.0
      code: pickup-convenience-offer
      displayName: Pickup Convenience Offer
      description: Synthetic incentive for order-ahead pickup
    - name: Loyalty Member Price
      liftBase: 6.0
      liftRange: 10.0
      coefBase: 9.0
      coefRange: 3.0
      code: loyalty-member-price
      displayName: Loyalty Member Price
      description: Synthetic member-only shelf price on non-clinical items
  successRatings: [Strong, Steady, Watch, Fell Short]

supply:
  disruptionTypes: [recall_hold, dc_delay, carrier_delay, substitution]
  disruptionSeverities: [critical, elevated, watch]
  disruptionDescriptions:
    recall_hold:
      - Synthetic recall hold on one Pain & Fever caplet lot pending human approval
      - Synthetic voluntary lot hold on a children's liquid SKU
    dc_delay:
      - Regional distribution center delayed cold and flu replenishment by two days
      - Distribution center slotting backlog slowed allergy replenishment
    carrier_delay:
      - Carrier delay slowed same-day delivery capacity in a metro region
      - Weather delay pushed store replenishment into the next window
    substitution:
      - Approved substitute SKU activated for a held lot
      - Substitution suggestions limited by on-shelf availability of alternates

stores:
  types:
    - Neighborhood Store
    - Urban Express Store
    - Pickup-Heavy Store
    - Fulfillment-Support Store
    - Regional Flagship Store

margin:
  driverCategories:
    - Product Cost
    - Fulfillment Labor
    - Delivery Cost
    - Shrink and Recall Write-Offs
    - Promotional Investment
    - Facility Overhead
  trendLabels: [improving, softening, holding, seasonal]
