competitive:
  competitorsByCategory:
    Spirits: ["Jack Daniel's", "Maker's Mark", "Patrón", "Grey Goose", "Tito's"]
    Grocery: ["Kroger", "Whole Foods", "Trader Joe's", "Aldi", "Safeway"]
    Quick-Serve Restaurant: ["McDonald's", "Chick-fil-A", "Chipotle", "Taco Bell", "Wendy's"]
    Home Improvement: ["Home Depot", "Lowe's", "Menards", "Ace Hardware", "True Value"]
    Office Supply: ["Staples", "Office Depot", "Amazon Business", "Costco Business"]
    Furniture: ["IKEA", "Wayfair", "Ashley Furniture", "Rooms To Go", "Pottery Barn"]
  pricingSources: [web_scrape, field_report, syndicated]
  shareSources: [Nielsen, IRI, internal_estimate, syndicated]
  activityTypes: [price_drop, new_product, promo_launch, distribution_change]
  impactLevels: [high, medium, low]
  activityTemplates:
    - type: price_drop
      description: "{0} dropped prices by {1}% on {2} products in {3}"
      recommendation: MATCH — Consider matching price within 2 weeks to avoid share loss
    - type: price_drop
      description: "{0} launched aggressive pricing on premium {2} line in {3}"
      recommendation: DIFFERENTIATE — Emphasize quality/heritage vs price competition
    - type: new_product
      description: "{0} launched new {2} product line targeting {3} market"
      recommendation: PREEMPT — Accelerate our own product pipeline to maintain innovation lead
    - type: new_product
      description: "{0} introduced value-tier {2} option in {3}"
      recommendation: IGNORE — Different segment, minimal overlap with our premium positioning
    - type: promo_launch
      description: "{0} started BOGO promotion on {2} in {3}"
      recommendation: MATCH — Launch counter-promotion within the same window
    - type: promo_launch
      description: "{0} launched loyalty program for {2} in {3}"
      recommendation: DIFFERENTIATE — Focus on product quality rather than loyalty discounts
    - type: distribution_change
      description: "{0} expanded {2} distribution to 200+ new stores in {3}"
      recommendation: PREEMPT — Secure additional shelf space before competitor gains foothold
    - type: distribution_change
      description: "{0} partnered with major retailer for exclusive {2} placement in {3}"
      recommendation: MATCH — Negotiate similar exclusive deals with competing retailers

promos:
  types:
    - name: BOGO
      liftBase: 15.0
      liftRange: 25.0
      coefBase: 22.0
      coefRange: 8.0
      code: bogo
      displayName: Buy One Get One
      description: BOGO promotions offering free or discounted additional units
    - name: Discount
      liftBase: 8.0
      liftRange: 18.0
      coefBase: 14.0
      coefRange: 6.0
      code: discount
      displayName: Discount
      description: Price-off promotions, typically 10-30% off regular price
    - name: Display
      liftBase: 5.0
      liftRange: 12.0
      coefBase: 8.0
      coefRange: 5.0
      code: display
      displayName: Display
      description: In-store display and end-cap placement promotions
    - name: Digital
      liftBase: 3.0
      liftRange: 10.0
      coefBase: 5.0
      coefRange: 4.0
      code: digital
      displayName: Digital
      description: Digital/online promotions including social media and email campaigns
    - name: Bundle
      liftBase: 10.0
      liftRange: 20.0
      coefBase: 16.0
      coefRange: 6.0
      code: bundle
      displayName: Bundle
      description: Product bundling promotions combining related items at a discount
  successRatings: [Excellent, Good, Average, Below Average, Poor]

supply:
  disruptionTypes: [logistics, supplier, weather, demand_surge]
  disruptionSeverities: [high, medium, low]
  disruptionDescriptions:
    logistics:
      - Port congestion causing 3-5 day delays on inbound shipments
      - Carrier capacity shortage affecting last-mile delivery
      - Distribution center labor shortage impacting order processing
      - Cross-dock facility equipment failure reducing throughput
      - Freight rate surge due to seasonal demand spike
      - Interstate route closure forcing alternate shipping lanes
      - Rail network delays affecting bulk shipments
    supplier:
      - Key raw material supplier facing production issues
      - Supplier quality audit triggered product hold
      - Packaging supplier lead time extended by 2 weeks
      - Secondary supplier contract renegotiation in progress
      - Supplier facility upgrade causing temporary capacity reduction
    weather:
      - Severe storms disrupting Southeast distribution routes
      - Winter weather advisories delaying Midwest deliveries
      - Hurricane season preparation affecting coastal warehousing
      - Heat wave impacting cold chain logistics
    demand_surge:
      - Unexpected viral social media driving 3x demand spike
      - Competitor stockout redirecting demand to our brands
      - Regional event driving above-forecast consumption

stores:
  types: [Flagship, Mall, Shopping Center, Downtown, Outlet]

margin:
  driverCategories: [Raw Materials, Labor, Logistics, Marketing, Packaging, Overhead]
  trendLabels: [increasing, decreasing, stable, volatile]
