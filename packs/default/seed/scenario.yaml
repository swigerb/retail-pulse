# Content pack seed manifest — issue #108
#
# This file is the machine-readable declarative source of every scenario-
# varying seed input used by the MCP server. Prior to issue #108 the default
# dataset was baked into RetailPulseDb.cs; that data now lives here so a pack
# switch changes both the tenant identity *and* the SQLite fact table
# contents. The values below are byte-verbatim ports of the historic
# defaults, verified by the DefaultPackSeed_MatchesLegacyOracle equivalence
# test in RetailPulse.Tests/Packs.
#
# Editing any value in this file changes the pack fingerprint and forces a
# reseed on next MCP boot. Do not remove sections without also updating
# SeedManifestLoader validation.

version: 1

