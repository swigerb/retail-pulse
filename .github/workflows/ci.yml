name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore RetailPulse.slnx

      - name: Build
        run: dotnet build RetailPulse.slnx --no-restore --configuration Release

      - name: Test with coverage
        run: |
          dotnet test RetailPulse.slnx \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./test-results \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      # Explicit fail-fast gate for the curated chart acceptance matrix (issue #50):
      # the manifest contract test, the semantic acceptance matrix (9 prompts × real
      # ChartSpec assertions), the token/tool-call performance-budget matrix, and the
      # existing chart-fulfillment invariant. Runs after the coverage-instrumented
      # suite so a chart-matrix regression trips CI with a targeted signal instead
      # of being buried in the broader test log.
      - name: Chart acceptance matrix (backend)
        run: |
          dotnet test tests/RetailPulse.Tests/RetailPulse.Tests.csproj \
            --no-build \
            --configuration Release \
            --filter "FullyQualifiedName~ChartAcceptance|FullyQualifiedName~ChartFulfillment"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./test-results/**/*.trx

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./test-results/**/coverage.opencover.xml

      - name: Install ReportGenerator
        if: success()
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        if: success()
        run: |
          reportgenerator \
            -reports:"./test-results/**/coverage.opencover.xml" \
            -targetdir:"./coverage-report" \
            -reporttypes:"Html;TextSummary"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage-html
          path: ./coverage-report

      - name: Check coverage threshold (informational)
        if: success()
        run: |
          if [ -f "./coverage-report/Summary.txt" ]; then
            echo "=== Coverage Summary ==="
            cat ./coverage-report/Summary.txt
            echo ""
            echo "Note: 70% threshold is aspirational — build does not fail on coverage."
          fi

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/RetailPulse.Web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/RetailPulse.Web/package-lock.json

      # Reproducible install from the committed lockfile, routed through the internal
      # package feed proxy by src/RetailPulse.Web/.npmrc (registry + replace-registry-host=always).
      # `npm ci` enforces the locked tree and its sha512 integrity; the official npm registry is
      # never contacted. It also never rewrites package-lock.json — the next step proves that.
      - name: Install dependencies (npm ci via internal proxy)
        run: npm ci

      - name: Verify lockfile unchanged by install (integrity)
        run: git diff --exit-code -- package-lock.json

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run

      # Explicit fail-fast gate for the curated chart acceptance matrix (issue #50):
      # the manifest contract test + the real-Recharts render matrix. Runs after the
      # broad test step so a manifest drift or an under-populated chart trips CI with
      # a targeted, easy-to-diagnose failure.
      - name: Chart acceptance matrix (frontend)
        run: npx vitest run src/__tests__/chartAcceptance.contract.test.ts src/__tests__/chartAcceptance.matrix.test.tsx

  security:
    name: Security (Vulnerable Packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore RetailPulse.slnx

      - name: Check for vulnerable packages
        run: |
          echo "=== Checking for known vulnerabilities ==="
          dotnet list RetailPulse.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
          if grep -q "has the following vulnerable packages" vulnerability-report.txt; then
            echo "::warning::Vulnerable packages detected — review vulnerability-report.txt"
          else
            echo "No known vulnerabilities found."
          fi

      - name: Upload vulnerability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-report
          path: vulnerability-report.txt

  provider-matrix:
    name: Auth Provider Matrix (Entra/GitHub/Anonymous)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/RetailPulse.Web/package-lock.json

      # Reproducible install from the committed lockfile, routed through the internal package
      # feed proxy by src/RetailPulse.Web/.npmrc (registry + replace-registry-host=always). The
      # lockfile carries full cross-platform optional binaries (rolldown/lightningcss/emnapi for
      # linux/darwin/win32), so `npm ci` reconstructs the exact tree on Linux and enforces its
      # sha512 integrity. The official npm registry is never contacted, and `npm ci` never mutates
      # the lockfile — the next step proves it is byte-for-byte unchanged.
      - name: Install frontend dependencies (npm ci via internal proxy)
        working-directory: src/RetailPulse.Web
        run: npm ci

      - name: Verify lockfile unchanged by install (integrity)
        working-directory: src/RetailPulse.Web
        run: git diff --exit-code -- package-lock.json

      # Frontend provider matrix: fail-closed config gate for every mode, plus a real build of
      # each mode (Entra/GitHub/Anonymous) with SAFE SYNTHETIC PUBLIC ids, asserting the immutable
      # auth-mode meta marker baked into the emitted index.html (only Entra satisfies the production
      # predicate). No live secrets, no .env files.
      - name: Frontend provider build matrix
        working-directory: src/RetailPulse.Web
        run: npm run test:provider-matrix

      # Backend provider matrix: the Development + non-Development startup/authorization suites
      # (Entra 200/401/403, Anonymous 2-route surface + 403, GitHub BFF/session/REST/hubs,
      # unknown/missing/cross-provider fail-closed) and the deployment Entra pins/parity.
      # The reusable gate emits a machine-readable TRX and enforces a conservative minimum count
      # (>=400) with zero failures; a zero-match run fails hard rather than passing vacuously.
      - name: Restore
        run: dotnet restore RetailPulse.slnx

      - name: Backend provider matrix (Security + Deployment, TRX + count gate)
        shell: pwsh
        run: ./scripts/Test-BackendAuthMatrix.ps1 -Configuration Release -NoRestore

      - name: Upload backend matrix TRX
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-auth-matrix-trx
          path: test-results-matrix/*.trx

  lint:
    name: Lint (dotnet format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore RetailPulse.slnx

      - name: Check formatting
        run: dotnet format RetailPulse.slnx --verify-no-changes --verbosity diagnostic

  bicep:
    name: Bicep (compile + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # az CLI ships pre-installed on ubuntu-latest; `az bicep install` grabs the
      # latest CLI-bundled Bicep compiler. Compile every module transitively via
      # the entry point — a broken module (missing param, wrong resource type,
      # invalid reference) fails the build, which is the cheapest possible gate
      # for regressions of the APIM AI Gateway / container-apps contract.
      - name: Install Bicep
        run: az bicep install

      - name: Bicep build (compile + lint)
        run: az bicep build --file infra/main.bicep --outfile /tmp/main.compiled.json

      - name: Upload compiled ARM template
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bicep-compiled
          path: /tmp/main.compiled.json
