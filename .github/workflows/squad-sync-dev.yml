name: Sync dev with main

# Promoting dev to main creates a merge commit on main that dev never receives, so
# dev silently falls behind every release. It reached 51 commits behind once. The
# old fix was a manual `git push origin origin/main:refs/heads/dev` after each
# promotion, which only holds for as long as someone remembers to run it.
#
# Protecting dev removes that manual push, and a direct push cannot be restored:
# GitHub refuses the Actions integration as a ruleset bypass actor outside an
# organization ("must be part of the ruleset source or owner organization"), and the
# only bypasses a personal repo accepts are the admin and maintain roles, which is
# precisely the access every agent already holds. A bypass there would protect
# nothing.
#
# So the sync goes through the protection instead of around it: push main to a sync
# branch, open a PR into dev, and let auto-merge land it once CI passes. The lead
# gate clears it automatically because its commits are already on main, which means
# they already passed the gate on the way in. No bypass actor and no standing
# credential exist on dev as a result.
#
# The sync branch head is the same commit as main's head, and check runs attach to a
# commit rather than to a pull request, so the CI that ran on the push to main already
# satisfies every required check on the sync PR. The one exception is the lead gate
# status, which is normally posted by a pull_request-triggered run. GitHub parks those
# runs in "action_required" when the pull request author is github-actions[bot], which
# would put a human approval back in the loop on every release. This job posts the gate
# status itself instead, on main's head commit, under the same containment reasoning the
# gate applies: the commit is already on main, so it has already been signed off.
#
# The same GITHUB_TOKEN authorship has a cosmetic side effect: GitHub records a workflow
# run for the sync pull request and then never dispatches it, so it ends as a zero-job
# "failure" the moment the pull request merges. Those shells publish no check runs and
# gate nothing, but they make a healthy Actions tab read as a failing one. The last step
# deletes them, guarded on a run having zero jobs so a real failure can never be caught
# by it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: sync-dev
  cancel-in-progress: false

jobs:
  sync:
    name: Sync dev with main
    runs-on: ubuntu-latest
    # Covers the wait for CI on the sync pull request, which is bounded by the
    # slowest required check rather than by anything this job does.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          fetch-depth: 0

      - name: Open sync pull request
        id: open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: sync/main-to-dev
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main dev

          # "dev is behind main" is the only state worth acting on. dev being ahead is
          # normal in-flight work, not drift.
          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "dev already contains main, nothing to sync"
            echo "pr=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          main_sha=$(git rev-parse origin/main)
          git push --force origin "${main_sha}:refs/heads/${SYNC_BRANCH}"

          # Posted here rather than left to the gate workflow, which cannot run
          # unattended on a bot-authored pull request. The context string must match
          # the ruleset's required check name exactly.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${main_sha}" \
            -f state=success \
            -f context='Squad lead sign-off' \
            -f description='Already released on main, so there is no new code to review.'

          pr=$(gh pr list --base dev --head "$SYNC_BRANCH" --state open \
                 --json number --jq '.[0].number // empty')

          if [ -z "$pr" ]; then
            body='Automated resync so dev does not fall behind main. Every commit here is already on main, so the Squad lead gate clears this PR on its own: the code passed the gate on its way into the release branch and there is nothing new to review. Opened by squad-sync-dev.yml, auto-merges once CI passes.'
            pr=$(gh pr create --base dev --head "$SYNC_BRANCH" \
                   --title "chore: sync dev with main" \
                   --body "$body" | grep -oE '[0-9]+$')
            echo "Opened sync PR #${pr}"
          else
            echo "Sync PR #${pr} already open, reusing it"
          fi

          # Auto-merge still honours every required check, including the lead gate, so
          # this waits for CI rather than short-circuiting it.
          gh pr merge "$pr" --merge --auto
          echo "Auto-merge armed on #${pr}"
          echo "pr=${pr}" >> "$GITHUB_OUTPUT"

      - name: Wait for the sync pull request to merge
        if: steps.open.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.open.outputs.pr }}
        run: |
          set -euo pipefail

          # Auto-merge is what actually lands the pull request; this job only watches.
          # Watching matters because the empty runs described in the next step cannot
          # be deleted until they have settled, which happens at the merge.
          for _ in $(seq 1 90); do
            state=$(gh pr view "$PR" --json state --jq .state)
            case "$state" in
              MERGED) echo "Sync PR #${PR} merged."; exit 0 ;;
              CLOSED) echo "Sync PR #${PR} was closed without merging."; exit 0 ;;
            esac
            sleep 10
          done

          echo "::warning::Sync PR #${PR} has not merged yet. Auto-merge stays armed, so it will land when its checks finish."

      - name: Delete the empty runs GitHub leaves on bot pull requests
        # always() so the sweep still runs when the wait above timed out or the
        # pull request was closed rather than merged.
        if: always() && steps.open.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: sync/main-to-dev
        run: |
          set -euo pipefail

          # Opening this pull request with GITHUB_TOKEN makes GitHub record a workflow
          # run for the pull_request event and then never dispatch it: measured on runs
          # 33421887474/532/550, every one had zero jobs, published zero check runs, and
          # was resolved as "failure" the second the pull request merged. Proven by
          # re-running one by hand, which executed normally under a human actor.
          #
          # Nothing reads them. The sync branch head is main's head, so the required
          # checks are already satisfied by the runs from the push to main. These
          # shells are pure noise, and three red entries per release make a healthy
          # Actions tab unreadable.
          #
          # The zero-job test is the safety property: a run that dispatched anything
          # has at least one job and is never touched, so this cannot delete evidence
          # of a real failure.
          deleted=0
          for id in $(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${SYNC_BRANCH}&event=pull_request&per_page=100" \
                --jq '.workflow_runs[] | select(.status == "completed") | .id'); do
            jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" --jq '.total_count')
            if [ "$jobs" -eq 0 ]; then
              if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}"; then
                deleted=$((deleted + 1))
                echo "Deleted empty run ${id}"
              else
                echo "::warning::Could not delete empty run ${id}"
              fi
            fi
          done
          echo "Removed ${deleted} empty run(s)."
